name: Setup Environment
description: Install and configure the shared CI environment
inputs:
  CACHIX_AUTH_TOKEN:
    required: true
    description: "Cachix Auth Token"
  SECRET_GITHUB_TOKEN:
    required: true
    description: "Github Secret Token"
  GLM_API_KEY:
    required: true
    description: "GLM API Key"
  MIMO_API_KEY:
    required: false
    description: "MIMO API Key"
  NIX_HATCHET_PROTOCOL:
    required: false
    default: "carve"
    description: "Disk reclamation level for Linux Nix jobs"
  NIX_WITNESS_CARNAGE:
    required: false
    default: "false"
    description: "Wait for Linux disk reclamation to finish before continuing"

runs:
  using: "composite"
  steps:
    - uses: wimpysworld/nothing-but-nix@main
      if: runner.os == 'Linux'
      with:
        hatchet-protocol: ${{ inputs.NIX_HATCHET_PROTOCOL }}
        witness-carnage: ${{ inputs.NIX_WITNESS_CARNAGE }}

    - name: Install nix
      uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ inputs.SECRET_GITHUB_TOKEN }}

    - name: Route temporary files to the Nix volume
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo chmod 1777 /nix/build
        echo "TMPDIR=/nix/build" >> "$GITHUB_ENV"
    # - uses: DeterminateSystems/nix-installer-action@main
    #   with:
    #     extra-conf: |
    #       accept-flake-config = true
    #     github_token: ${{ inputs.SECRET_GITHUB_TOKEN }}

    # - uses: DeterminateSystems/magic-nix-cache-action@main
    - name: Setup cachix
      uses: cachix/cachix-action@master
      with:
        name: tao3k
        authToken:
          "${{ inputs.CACHIX_AUTH_TOKEN }}"
          # signingKey: "${{ secrets.CACHIX_SIGNING_KEY }}"

    - name: Install devenv.sh
      shell: bash
      run: nix profile add nixpkgs#devenv

    - name: Write .env
      shell: bash
      env:
        GLM_API_KEY: ${{ inputs.GLM_API_KEY }}
        MIMO_API_KEY: ${{ inputs.MIMO_API_KEY }}
      run: |
        {
          echo "GLM_API_KEY=$GLM_API_KEY"
          if [ -n "${MIMO_API_KEY:-}" ]; then
            echo "MIMO_API_KEY=$MIMO_API_KEY"
            echo "MIMO_API_KEY=$MIMO_API_KEY" >> "$GITHUB_ENV"
            echo "MIMO_API_KEY_AVAILABLE=true" >> "$GITHUB_ENV"
          else
            echo "MIMO_API_KEY_AVAILABLE=false" >> "$GITHUB_ENV"
          fi
        } > .env
        # NAR hash mismatch in input issue, I don't know why
        # nix flake update omnibus
